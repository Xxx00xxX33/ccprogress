<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ccprogress</title>
  <desc id="desc">ccprogress shows which step a long session is on: a segmented progress bar sits above the prompt, next to the spinner that by default only shows time and tokens.</desc>

  <rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="#F7F5F0" stroke="#E6E2D8"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="64" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#8A857B">FOR CLAUDE CODE · TERMINAL + DESKTOP</text>
    <text x="60" y="184" font-size="84" font-weight="700" letter-spacing="-2" fill="#1F1E1C">ccprogress</text>

    <g id="motif" transform="translate(64 212)">
      <rect x="0" width="52" height="8" rx="4" fill="#22A06B"/>
      <rect x="60" width="52" height="8" rx="4" fill="#22A06B"/>
      <rect x="120" width="52" height="8" rx="4" fill="#D97757" fill-opacity="0.6"/>
      <rect x="180" width="52" height="8" rx="4" fill="#E3DFD5"/>
      <rect x="240" width="52" height="8" rx="4" fill="#E3DFD5"/>
    </g>

    <text x="64" y="284" font-size="30" font-weight="600" fill="#1F1E1C">See which step a long session is on.</text>
    <text x="64" y="324" font-size="22" fill="#6B675F">A live step-by-step progress bar beside the</text>
    <text x="64" y="354" font-size="22" fill="#6B675F">spinner, which only shows time and tokens.</text>
  </g>

  <g id="desktop-preview" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="660" y="56" width="476" height="308" rx="18" fill="#FFFFFF" stroke="#E6E2D8"/>

    <rect x="684" y="84" width="300" height="10" rx="5" fill="#ECE9E1"/>
    <rect x="684" y="104" width="220" height="10" rx="5" fill="#ECE9E1"/>

    <text x="684" y="156" font-size="20" fill="#D97757">✶</text>
    <text x="712" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A857B">4m 12s · 58k tokens · Running…</text>

    <rect x="684" y="186" width="428" height="64" rx="14" fill="#F1EFE9"/>
    <circle cx="710" cy="218" r="10" fill="none" stroke="#D97757" stroke-width="2" stroke-opacity="0.35"/>
    <circle cx="710" cy="218" r="5" fill="#D97757"/>
    <text x="732" y="225" font-size="20" fill="#1F1E1C">Run the tests</text>
    <g transform="translate(944 216)">
      <rect x="0" width="16" height="5" rx="2.5" fill="#22A06B"/>
      <rect x="20" width="16" height="5" rx="2.5" fill="#22A06B"/>
      <rect x="40" width="16" height="5" rx="2.5" fill="#D97757" fill-opacity="0.6"/>
      <rect x="60" width="16" height="5" rx="2.5" fill="#E3DFD5"/>
      <rect x="80" width="16" height="5" rx="2.5" fill="#E3DFD5"/>
    </g>
    <text x="1056" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A857B">3/5</text>

    <rect x="684" y="268" width="428" height="64" rx="14" fill="#FFFFFF" stroke="#DCD8CE"/>
    <text x="706" y="306" font-size="18" fill="#A8A398">Type / for commands</text>
  </g>
</svg>
